name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-workspace
      - run: moon run :check
      - run: moon run :typecheck
      - run: moon run :test

  migrate:
    name: Migrate database
    needs: test
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      BETTER_AUTH_URL: ${{ vars.BETTER_AUTH_URL || 'https://api-debate.randika.dev' }}
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
      WEB_ORIGIN: ${{ vars.WEB_ORIGIN || 'https://debate.randika.dev' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-workspace
      - run: pnpm --filter @app/api migrate

  deploy:
    name: Deploy ${{ matrix.name }}
    needs: [test, migrate]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dir: apps/api
          - name: web
            dir: apps/web
          - name: worker
            dir: apps/worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      VITE_API_URL: ${{ vars.VITE_API_URL || 'https://api-debate.randika.dev' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-workspace

      - name: Build web
        if: matrix.name == 'web'
        run: pnpm --filter @app/web build

      - name: Deploy
        working-directory: ${{ matrix.dir }}
        run: pnpm exec wrangler deploy --keep-vars
