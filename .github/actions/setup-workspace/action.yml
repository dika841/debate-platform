name: "Set up workspace"
description: "Install pnpm, Node, workspace dependencies and the moon toolchain"

runs:
  using: "composite"
  steps:
    - uses: pnpm/action-setup@v4
      with:
        version: 12.17.0

    - uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: pnpm

    - run: pnpm install --frozen-lockfile
      shell: bash

    - uses: moonrepo/setup-toolchain@v0
      with:
        auto-install: true
