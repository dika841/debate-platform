name: debate-platform

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    volumes:
      - debate-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-app}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.31
    restart: unless-stopped
    ports:
      - "8026:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: debate-platform:latest
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    command: ["pnpm", "--filter", "@app/api", "migrate"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@postgres:5432/${POSTGRES_DB:-app}
      BETTER_AUTH_URL: ${PUBLIC_AUTH_URL:-http://localhost:8080}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-change-me-change-me-change-me-change-me}
      WEB_ORIGIN: ${PUBLIC_WEB_URL:-http://localhost:8080}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: debate-platform:latest
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@postgres:5432/${POSTGRES_DB:-app}
      BETTER_AUTH_URL: ${PUBLIC_AUTH_URL:-http://localhost:8080}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-change-me-change-me-change-me-change-me}
      WEB_ORIGIN: ${PUBLIC_WEB_URL:-http://localhost:8080}
    ports:
      - "3001:3001"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  worker:
    image: debate-platform:latest
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    restart: unless-stopped
    command: ["pnpm", "--filter", "@app/worker", "start"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@postgres:5432/${POSTGRES_DB:-app}
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    image: debate-platform-web:latest
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      network: host
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  debate-postgres:
